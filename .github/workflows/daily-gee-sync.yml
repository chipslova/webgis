name: Live GEE MODIS LST (Terra + Aqua) Sync

on:
  schedule:
    # Runs daily at 00:00 UTC to sync latest MODIS Terra + Aqua composites
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-modis-lst:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy earthengine-api

      - name: Run MODIS LST Terra + Aqua Data Sync
        env:
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
        run: |
          python scripts/sync_modis_lst.py

      - name: Commit and push updated MODIS LST datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/gee_cfsv2_* public/downloads/gee_cfsv2_*
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gee): automated live sync MODIS LST Terra+Aqua datasets [skip ci]" && git push)
